[project]
name = "docuwing-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20", "pydantic-settings>=2.4", "httpx>=0.27",
  "python-multipart>=0.0.9", "aiofiles>=24.1", "pymupdf>=1.24",
  "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
local = ["lancedb>=0.13", "pytesseract>=0.3", "pillow>=10.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
