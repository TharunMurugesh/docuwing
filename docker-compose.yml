services:
  backend:
    build: ./backend
    environment:
      DOCUWING_OLLAMA_URL: http://ollama:11434
      DOCUWING_CORS_ORIGIN: http://localhost:3000
    volumes: [docuwing-data:/data]
    ports: ["8000:8000"]
    depends_on: [ollama]
  frontend:
    build: ./frontend
    environment: [NEXT_PUBLIC_API_URL=http://localhost:8000]
    ports: ["3000:3000"]
    depends_on: [backend]
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama-data:/root/.ollama]
    ports: ["11434:11434"]
volumes:
  docuwing-data:
  ollama-data:
