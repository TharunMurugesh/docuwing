[project]
name = "docuwing-workspace"
version = "0.1.0"
description = "Transform unstructured documents into structured, actionable knowledge."
requires-python = ">=3.11"
dependencies = [
    "docuwing-engine",
]

[tool.uv.workspace]
members = ["apps/api", "packages/engine"]

[tool.uv.sources]
docuwing-engine = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]
ignore = ["N818", "TCH", "UP042", "B027", "N802", "B024"]

[tool.ruff.lint.isort]
known-first-party = ["docuwing_engine", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/engine", "apps/api"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "conformance: marks tests as conformance tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["migrations", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "docx.*",
    "openpyxl.*",
    "pytesseract.*",
    "paddleocr.*",
    "magic.*",
    "yaml.*",
    "aiofiles.*",
    "fastapi.*",
    "starlette.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.*"]
ignore_errors = true

[tool.importlinter]
root_packages = ["docuwing_engine", "app"]

[[tool.importlinter.contracts]]
name = "Engine must not import App"
type = "forbidden"
source_modules = ["docuwing_engine"]
forbidden_modules = ["app"]
